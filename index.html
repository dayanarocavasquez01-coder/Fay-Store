resumenOld(){
 const ing=sum(S.ingresos,'monto'),eg=sum(S.egresos,'monto'),inv=sum(S.inversiones,'monto'),g=ing-eg;
 const pp=S.deudas.filter(d=>d.tipo==='Por pagar'),pc=S.deudas.filter(d=>d.tipo==='Por cobrar');
 const sal=a=>sum(a,'monto')-sum(a,'pagado');
 const stock=S.productos.reduce((t,p)=>t+p.costo*p.stock,0);
 const k=(l,v,c)=>`<div class="kpi"><small>${l}</small><b class="${c||''}">${v}</b></div>`;
 const low=S.productos.filter(p=>p.stock<=2);
 return `<div class="kpis">${k('Ingresos',fmt(ing),'good')}${k('Egresos',fmt(eg),'bad')}${k('Ganancia (ingresos − egresos)',fmt(g),g>=0?'good':'bad')}${k('Inversión total',fmt(inv))}${k('Retorno sobre inversión',inv?(g/inv*100).toFixed(1)+'%':'—',g>=0?'good':'bad')}${k('Deudas por pagar',fmt(sal(pp)),'bad')}${k('Por cobrar',fmt(sal(pc)),'good')}${k('Valor del inventario (costo)',fmt(stock))}</div>
 <div class="card"><h2>Stock bajo (2 o menos)</h2>${low.length?low.map(p=>`<div>${esc(p.cod)} · ${esc(p.nom)} — <b>${p.stock}</b></div>`).join(''):'<div class="empty">Sin alertas.</div>'}</div>`},

 const P=pmap(),T=gsum(S.ingresos,P),R=sum(RT(),'monto'),M=today().slice(0,7),GM=gsum(S.ingresos.filter(i=>(i.fecha||'').slice(0,7)===M),P);

 return `<div class='card'><h2>💎 Ganancia real</h2>

async function fload(){try{const t=(await fdb()).transaction('f').objectStore('f'),ks=await new Promise(r=>{const q=t.getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}),vs=await new Promise(r=>{const q=t.getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])});ks.forEach((k,i)=>{FOT[k]=vs[i]});if(ks.length)render()}catch(e){}}
function shrink(file,max=900,q=.72){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
const fth=id=>FOT[id]?`<button class="ft" data-foto="${id}" title="Ver foto"><img src="${FOT[id]}" alt=""></button>`:`<button class="ft no" data-foto="${id}" title="Agregar foto">📷</button>`;
const vpic=()=>SC.fid&&FOT[SC.fid]?`<button class="ft big" data-foto="${SC.fid}"><img src="${FOT[SC.fid]}" alt=""></button>`:'';
function fotoView(id){
 const p=S.productos.find(x=>x.id===id);if(!p)return;
 const o=document.createElement('div');o.className='fv';
 const inp=g=>`<label class="fl${g?' g':''}">${g?'🖼️ Galería':'📷 '+(FOT[id]?'Cambiar':'Tomar')+' foto'}<input type="file" accept="image/*"${g?'':' capture="environment"'} hidden></label>`;
 const draw=()=>{o.innerHTML=`<button class="fx" data-v="0" title="Cerrar">✕</button>${FOT[id]?`<img src="${FOT[id]}" alt="">`:'<div class="fno">Este producto aún no tiene foto.</div>'}<div class="fc"><b>${esc(p.cod)}</b> · ${esc(p.nom)}${p.det?' · '+esc(p.det):''}<br>${fmt(p.precio)} · Stock ${p.stock}</div><div class="fbt">${inp(0)}${inp(1)}${FOT[id]?'<button class="btn x s" data-v="2">Quitar foto</button>':''}</div>`};
 draw();
 o.onclick=e=>{const b=e.target.closest('button');
  if(e.target===o||(b&&b.dataset.v==='0'))o.remove();
  else if(b&&b.dataset.v==='2'){delete FOT[id];fdel(id);draw();render();toast('Foto quitada')}};
 o.onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const d=await shrink(f);FOT[id]=d;fput(id,d);draw();render();toast('Foto guardada ✔')}catch(x){toast('No se pudo leer la foto.')}};
 document.body.appendChild(o)}
document.addEventListener('change',async e=>{
 if(e.target.id==='pfoto'||e.target.id==='pfoto2'){const f=e.target.files&&e.target.files[0];if(!f)return;
  try{PF=await shrink(f);const pv=$('#pprev');if(pv)pv.innerHTML=`<img src="${PF}" alt="">`}catch(x){toast('No se pudo leer la foto.')}}});
fload();
function fillAttr(){
 const c=S.cats[$('#pc').value];if(!c)return;
 $('#pf').innerHTML=c.fields.map((f,i)=>dd('f'+i,f.opts,f.label)).join('');
 $('#pcod').value=nextCode($('#pc').value);sync()}
function render(){
 $('#nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('');
 if(tab==='vender'&&SC.on&&$('#vcam')){refreshV();return}
 if(tab==='descuentos')tab='productos';
 if(tab!=='vender')camOff();
 if(tab!=='productos')PF=null;
 $('#app').innerHTML=views[tab]();
 if(tab==='productos')fillAttr();if(tab==='etiquetas')drawL();if(tab==='resumen')charts();sync()}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(d.tab){tab=d.tab;render();scrollTo(0,0)}
 else if(d.demo){demo=!demo;render()}
 else if(d.print){window.print()}
 else if(d.act){ACT[d.act]&&ACT[d.act]()}
 else if(d.lsel){const c=$('#lc').value;S.productos.filter(p=>!c||p.cat===c).forEach(p=>d.lsel==='1'?lnot.delete(p.id):lnot.add(p.id));drawL()}
 else if(d.foto){fotoView(d.foto)}
 else if(d.edit){const[c,id]=d.edit.split(':');editRec(c,id)}
 else if(d.del){const[c,id]=d.del.split(':');
  if(!await ask('¿Eliminar este registro?'))return;
  if(c==='ingresos'){const i=S.ingresos.find(x=>x.id===id),p=i&&S.productos.find(x=>x.id===i.prod);if(p){p.stock+=i.cant||0;touch(p)}}
  if(c==='productos'){delete FOT[id];fdel(id)}
  S[c]=S[c].filter(x=>x.id!==id);tomb(id);save();render()}
 else if(d.ab){const v=+$('#ab'+d.ab).value,x=S.deudas.find(z=>z.id===d.ab);
  if(v>0&&x){x.pagado=Math.min(x.monto,x.pagado+v);save();render()}}
 else if(d.rmopt!==undefined){getL(selL).arr.splice(+d.rmopt,1);save();render()}
 else if(d.rmfld){const L=getL(selL),c=S.cats[L.cat];
  if(c.fields.length<2)return toast('La categoría debe tener al menos una lista.');
  c.fields.splice(L.idx,1);selL='c|'+L.cat+'|0';save();render()}
 else if(d.rmcat){const k=getL(selL).cat;
  if(S.productos.some(p=>p.cat===k))return toast('Hay productos en esa categoría; elimínalos primero.');
  if(!await ask('¿Eliminar la categoría "'+k+'"?'))return;
  delete S.cats[k];selL=allL()[0];save();render()}});
document.addEventListener('change',e=>{
 if(e.target.id==='pc')fillAttr();
 if(e.target.id==='hb')$('#bw').hidden=!e.target.checked;
 if(e.target.id==='rf')restore(e.target.files[0]);
 if(e.target.id==='dp'){dper=e.target.value;render()}
 if(e.target.classList.contains('lk')){e.target.checked?lnot.delete(e.target.dataset.id):lnot.add(e.target.dataset.id);drawL()}
 if(e.target.id==='lc'||e.target.id==='lp')drawL();
 if(e.target.id==='sc'){selL=e.target.value;render()}
 if(e.target.dataset.dd)sync();
 if(e.target.id==='icat'){const ip=$('#ip');if(ip){ip.innerHTML=prodOpts(e.target.value);ingCalc()}}
 if(e.target.id==='ip'){const p=S.productos.find(x=>x.id===e.target.value),c=$('#icat');if(p&&c&&c.value!==p.cat){c.value=p.cat;e.target.innerHTML=prodOpts(p.cat,p.id)}}
 if(e.target.id==='ip'||e.target.id==='iq'||e.target.id==='idc'||e.target.id==='idt')ingCalc()});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q')$('#plist').innerHTML=prodTable(t.value);
 if(t.id==='ln')drawL();
 if(t.id==='idc'||t.id==='iq')ingCalc();
 if(['costo','pmode','ppct'].includes(t.name)&&t.form&&t.form.pmode){const f=t.form,m=f.pmode.value,p=f.precio,c=parseFloat(f.costo.value),pc=m==='auto'?50:parseFloat(f.ppct.value);
  f.querySelector('#ppw').hidden=m!=='otro';p.readOnly=m!=='manual';
  if(m==='manual'){p.placeholder='Escribe el precio';if(t.name==='pmode')p.focus()}
  else{p.placeholder=m==='otro'?'Escribe el porcentaje':'Se calcula con el costo';p.value=(!isNaN(c)&&!isNaN(pc))?(c*(1+pc/100)).toFixed(2):''}}});
document.addEventListener('submit',async e=>{
 e.preventDefault();
 const f=Object.fromEntries(new FormData(e.target)),k=e.target.dataset.f;
 if(k==='prod'){
  if(S.productos.some(p=>p.cod.toLowerCase()===f.cod.trim().toLowerCase()))return toast('Ese código ya existe.');
  const fl=S.cats[f.cat].fields,v=fl.map((x,i)=>res(f,'f'+i,x.opts));
  if(v.includes(null))return toast('Escribe la nueva opción o elige una de la lista.');
  const pid=uid();S.productos.push({id:pid,cod:f.cod.trim(),nom:v[0],det:v.slice(1).join(' · '),marca:f.hasb?f.marca:'',desc:(f.desc||'').trim(),cat:f.cat,costo:+f.costo,precio:+f.precio,stock:+f.stock||0});if(PF){FOT[pid]=PF;fput(pid,PF);PF=null}toast('Producto guardado')}
 else if(k==='ing'){
  const p=S.productos.find(x=>x.id===f.prod),q=+f.cant||1,cn=res(f,'concepto',S.listas.ing);
  if(cn===null)return toast('Escribe el concepto nuevo o elige uno.');
  if(p){if(p.stock<q)return toast('Stock insuficiente ('+p.stock+' disponibles).');p.stock-=q;touch(p)}
  const mo=+f.monto;let dsc=Math.max(0,+f.desc||0);if(f.dt==='%')dsc=p?+(p.precio*q*Math.min(dsc,100)/100).toFixed(2):0;if(p&&dsc===0&&mo<p.precio*q-.005)dsc=+(p.precio*q-mo).toFixed(2);
  S.ingresos.push({id:uid(),fecha:f.fecha,concepto:cn,cat:p?p.cat:(f.cat||''),prod:f.prod||'',cant:p?q:0,monto:mo,lista:+(mo+dsc).toFixed(2),desc:dsc,costo:p?+(p.costo*q).toFixed(2):0,ts:Date.now()});toast(dsc>0?'Ingreso registrado (con descuento de '+fmt(dsc)+')':'Ingreso registrado')}
 else if(k==='ret'){const mo=+f.monto,disp=gsum(S.ingresos).g-sum(RT(),'monto');
  if(mo>disp+.005&&!await ask('Vas a retirar '+fmt(mo)+' pero solo hay '+fmt(disp)+' de ganancia real disponible. ¿Registrar igual?'))return;
  RT().push({id:uid(),fecha:f.fecha,tipo:f.tipo,monto:mo,nota:(f.nota||'').trim(),ts:Date.now()});toast('Retiro registrado')}
 else if(k==='egr'){const cn=res(f,'concepto',S.listas.egr);if(cn===null)return toast('Escribe el concepto nuevo o elige uno.');S.egresos.push({id:uid(),fecha:f.fecha,concepto:cn,monto:+f.monto});toast('Egreso registrado')}
 else if(k==='inv'){const cn=res(f,'concepto',S.listas.inv);if(cn===null)return toast('Escribe el concepto nuevo o elige uno.');S.inversiones.push({id:uid(),fecha:f.fecha,concepto:cn,monto:+f.monto});toast('Inversión registrada')}
 else if(k==='deu'){const pe=res(f,'persona',S.listas.per),cn=res(f,'concepto',S.listas.deu);if(pe===null||cn===null)return toast('Escribe la nueva opción o elige una de la lista.');S.deudas.push({id:uid(),fecha:f.fecha,tipo:f.tipo,persona:pe,concepto:cn,monto:+f.monto,pagado:0,vence:f.vence});toast('Deuda registrada')}
 else if(k==='cat'){const n=f.nombre.trim(),fl=f.label.split(',').map(x=>x.trim()).filter(Boolean);if(S.cats[n]||!fl.length)return toast('Esa categoría ya existe o faltan listas.');S.cats[n]={fields:fl.map(x=>F(x,[]))};selL='c|'+n+'|0';toast('Categoría creada: ahora agrega las opciones de sus listas')}
 else if(k==='opt'){const a=getL(selL).arr;f.op.split(',').map(x=>x.trim()).filter(Boolean).forEach(o=>{if(!a.some(x=>x.toLowerCase()===o.toLowerCase()))a.push(o)})}
 else if(k==='fld'){const k2=getL(selL).cat,c=S.cats[k2];c.fields.push(F(f.fn.trim(),[]));selL='c|'+k2+'|'+(c.fields.length-1)}
 save();render()});
render();setSt();cloudInit();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CL()&&!cBusy&&!cDirty)pull().catch(()=>{})});

/* ===== Interactividad ===== */
(function(){
 document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,nav button,.fl');if(!b)return;const r=b.getBoundingClientRect(),d=document.createElement('span');d.className='rp';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';b.appendChild(d);setTimeout(()=>d.remove(),650)});
 const h=document.querySelector('.hd');
 if(h){[[8,18,'✦',14],[88,30,'✧',18],[14,64,'✧',12],[84,70,'✦',12],[30,8,'✦',10],[68,10,'✧',12]].forEach((a,i)=>{const t=document.createElement('span');t.className='tw';t.textContent=a[2];t.style.cssText='left:'+a[0]+'%;top:'+a[1]+'%;font-size:'+a[3]+'px;animation-delay:'+(i*.45)+'s;color:'+(i%3==0?'#f06b9b':i%3==1?'#b58be8':'#6fb2f2');h.appendChild(t)});
  const f=h.querySelector('.fay');if(f)f.addEventListener('click',()=>{for(let i=0;i<10;i++){const p=document.createElement('span');p.textContent=['♥','✦','✧'][i%3];p.style.cssText='position:fixed;left:'+(innerWidth/2+(Math.random()*160-80))+'px;top:'+(scrollY>0?80:90)+'px;font-size:'+(14+Math.random()*14)+'px;color:'+['#f06b9b','#b58be8','#6fb2f2'][i%3]+';pointer-events:none;z-index:50;transition:all 1.1s ease-out;opacity:1';document.body.appendChild(p);requestAnimationFrame(()=>{p.style.transform='translate('+(Math.random()*120-60)+'px,'+(60+Math.random()*120)+'px) rotate('+(Math.random()*360)+'deg)';p.style.opacity='0'});setTimeout(()=>p.remove(),1200)}})}
 const t=document.createElement('button');t.id='top';t.title='Subir';t.textContent='↑';t.onclick=()=>scrollTo({top:0,behavior:'smooth'});document.body.appendChild(t);
 addEventListener('scroll',()=>t.classList.toggle('on',scrollY>300),{passive:true});
})();

/* ===== BARBIE GAME THEME ===== */
(function(){
 const C=['#ff4fa3','#b58be8','#6fb2f2','#ff9bcb','#ffd54f'],Sy=['♥','✦','✧','★','♡'];
 const fx=document.createElement('div');fx.id='fx';
 for(let i=0;i<18;i++){const e=document.createElement('i');e.textContent=Sy[i%Sy.length];e.style.cssText='left:'+(Math.random()*98)+'%;font-size:'+(12+Math.random()*22)+'px;color:'+C[i%C.length]+';animation-duration:'+(11+Math.random()*14)+'s;animation-delay:-'+(Math.random()*20)+'s';fx.appendChild(e)}
 document.body.prepend(fx);
 const dust=(x,y,n,far)=>{for(let i=0;i<n;i++){const p=document.createElement('span');p.className='dust';p.textContent=Sy[(Math.random()*Sy.length)|0];p.style.left=x+'px';p.style.top=y+'px';p.style.color=C[(Math.random()*C.length)|0];p.style.fontSize=(10+Math.random()*(far?16:8))+'px';document.body.appendChild(p);const a=Math.random()*Math.PI*2,d=far?(50+Math.random()*110):(12+Math.random()*22);requestAnimationFrame(()=>{p.style.transform='translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+(far?40:14))+'px) rotate('+(Math.random()*360)+'deg) scale(.4)';p.style.opacity='0'});setTimeout(()=>p.remove(),900)}};
 let lt=0;addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const n=Date.now();if(n-lt<45)return;lt=n;dust(e.clientX,e.clientY,1,false)},{passive:true});
 document.addEventListener('click',e=>{if(e.target.closest('.btn,nav button,.fl,.fay'))dust(e.clientX,e.clientY,9,true)});
 const _t=toast;toast=function(m){_t(m);if(/guardad|registrad|vendido|✔|listo|copia|descarg/i.test(m||'')){const w=innerWidth/2,h=innerHeight-60;dust(w,h,22,true)}};
 function hud(){const h=document.querySelector('.hd');if(!h)return;let d=h.querySelector('.hud');if(!d){d=document.createElement('div');d.className='hud';h.appendChild(d)}
  try{const td=today(),ing=S.ingresos||[],hoy=ing.filter(i=>i.fecha===td),tot=hoy.reduce((a,i)=>a+(+i.monto||0),0),n=ing.length,lv=Math.floor(n/10)+1,pr=(n%10)*10;
   d.innerHTML='<span>⭐ Nivel '+lv+'<b class="xpb"><i style="width:'+pr+'%"></i></b></span><span>💰 Hoy: '+fmt(tot)+'</span><span>🛍️ '+hoy.length+' venta'+(hoy.length===1?'':'s')+' hoy</span><span>💖 '+(S.productos||[]).length+' productos</span>'}catch(e){}}
 const _r=render;render=function(){_r.apply(this,arguments);hud()};hud();
})();
</script></body></html>
